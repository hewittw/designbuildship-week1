    align-items:center;

    position:relative;
  }
  /* faint scanline texture, kept subtle so text stays legible */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(51,63,38,0.05) 0px,
      rgba(51,63,38,0.05) 1px,

    flex-direction:column;
    height:min(78vh, 680px);

    position:relative;
    z-index:2;

  .term-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 14px;
    border-bottom:2px solid var(--line);
    font-size:.78rem;
    color:var(--ink-dim);

  .term-head .dots span{

    display:inline-block; background:var(--ink-dim); opacity:.45;
  }
  .term-head .title{ flex:1; text-align:center; letter-spacing:.04em; }

  .output{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px 18px;
    font-size:.92rem;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;

  .output .block{ margin-bottom:16px; }
  .output .echo-line{ color:var(--accent); margin-bottom:6px; }
  .output .echo-line .echo-prompt{ opacity:.75; }
  .output .heading{ color:var(--accent); font-weight:bold; }

  .output .ok{ color:var(--good); }
  .output a.inline-link{ color:var(--accent); text-decoration:underline; cursor:pointer; }

    width:120px;
    height:120px;

    border:2px solid var(--line);
    margin:6px 8px 6px 0;

  table.boxtable tr.hl-match{ background:#c9d8b8; }

  // ---------- LZW dictionary-building visualization ----------

  function computeLZWFrames(str){
    var chars = [];
    for (var i = 0; i < str.length; i++){
      if (chars.indexOf(str[i]) === -1) chars.push(str[i]);
    }
    chars.sort();
    var dict = {};
    var order = [];
    chars.forEach(function(c, idx){ dict[c] = idx; order.push(c); });
    var nextCode = chars.length;
    var w = '';
    var outCodes = [];
    var frames = [];

    function snapshot(note){
      var entries = order.map(function(k){ return { seq:k, code:dict[k] }; });
      return { entries: entries, output: outCodes.slice(), note: note };
    }

    frames.push(snapshot('dictionary initialized from the sample alphabet.'));

    for (var i2 = 0; i2 < str.length; i2++){
      var c = str[i2];
      var wc = w + c;
      if (dict.hasOwnProperty(wc)){
        w = wc;
        frames.push(snapshot('matched "' + wc + '" in dictionary -- keep extending.'));
      } else {
        var code = dict[w];
        outCodes.push(code);
        dict[wc] = nextCode;
        order.push(wc);
        frames.push(snapshot('emit ' + code + ' for "' + w + '", add "' + wc + '" = ' + nextCode));
        nextCode++;
        w = c;
      }
    }
    if (w !== ''){
      outCodes.push(dict[w]);
      frames.push(snapshot('emit ' + dict[w] + ' for "' + w + '" (end of input).'));
    }
    frames.push(snapshot('done -- ' + outCodes.length + ' codes emitted for ' + str.length + ' input symbols.'));
    return frames;
  }

  function renderLZWViz(){
    var sample = 'TOBEORNOTTOBEORTOBEORNOT';
    var frames = computeLZWFrames(sample);

    var div = block();
    div.innerHTML =
      '<div class="dim">sample input: "' + sample + '"</div>' +
      '<div class="lzw-table-wrap" style="margin-top:6px;"></div>' +
      '<div class="lzw-note viz-note"></div>';
    var tableWrap = div.querySelector('.lzw-table-wrap');
    var noteEl = div.querySelector('.lzw-note');

    var idx = 0;
    function renderFrame(f){
      var rows = f.entries.map(function(e){
        var isNew = (idx > 0 && f.entries[f.entries.length-1] === e && f.note.indexOf('add') !== -1);
        return '<tr' + (isNew ? ' class="hl-new"' : '') + '><td>"' + e.seq + '"</td><td>' + e.code + '</td></tr>';
      }).join('');
      tableWrap.innerHTML =
        '<table class="boxtable"><tr><th>sequence</th><th>code</th></tr>' + rows + '</table>' +
        '<div class="dim">output so far: [' + f.output.join(', ') + ']</div>';
      noteEl.textContent = f.note;
      scrollBottom();
    }

    renderFrame(frames[0]);
    var timer = setInterval(function(){
      idx++;
      if (idx >= frames.length){
        clearInterval(timer);
        return;
      }
      renderFrame(frames[idx]);
    }, 450);
    registerCancel(function(){ clearInterval(timer); });
  }

    var stripCv = div.querySelector('#tviz-strip'), stripCtx = stripCv.getContext('2d');

    var errCv = div.querySelector('#tviz-error'), errCtx = errCv.getContext('2d');
    var note = div.querySelector('.viz-note');

    var SW = stripCv.width, SH = stripCv.height;
    var LW = latentCv.width, LH = latentCv.height;
    var EW = errCv.width, EH = errCv.height;

    // ---- shared time / drift clock (drives all three views) ----
    var frame = 0;
    var ANOMALY_START = 70;
    var ANOMALY_DURATION = 110;
    var HOLD = 140;
    var PERIOD = ANOMALY_START + ANOMALY_DURATION + HOLD;

    function driftInfo(){
      var t = frame % PERIOD;
      if (t < ANOMALY_START) return { phase:'calm', driftT:0 };
      if (t < ANOMALY_START + ANOMALY_DURATION){
        return { phase:'drifting', driftT:(t - ANOMALY_START) / ANOMALY_DURATION };
      }
      return { phase:'anomaly', driftT:1 };
    }

    // ---- view 1: 5-channel telemetry strip ----
    var channels = [
      { name:'Power Bus Voltage',    freq:0.09, amp:8, noise:1.4, faulty:false },
      { name:'Battery Temperature',  freq:0.05, amp:6, noise:1.1, faulty:false },
      { name:'Reaction-Wheel Speed', freq:0.07, amp:7, noise:1.3, faulty:true  },
      { name:'Solar Array Current',  freq:0.11, amp:9, noise:1.6, faulty:false },
      { name:'Uplink SNR',           freq:0.06, amp:5, noise:1.0, faulty:false }
    ];
    var BUF_LEN = 140;
    channels.forEach(function(c){
      c.phase = Math.random() * Math.PI * 2;
      c.buf = [];
      for (var k = 0; k < BUF_LEN; k++){ c.buf.push(Math.sin(k*c.freq + c.phase) * c.amp); }
    });
    var rowH = SH / channels.length;
    var labelW = 132;
    var stripPlotW = SW - labelW - 8;

    function stepStrip(d){
      channels.forEach(function(c){
        var v = Math.sin(frame*c.freq + c.phase) * c.amp + (Math.random()-0.5) * c.noise;
        if (c.faulty){
          v += d.driftT*24 + d.driftT*d.driftT*10*Math.sin(frame*0.25);
        }
        c.buf.push(v);
        if (c.buf.length > BUF_LEN) c.buf.shift();
      });
    }

    function drawStrip(d){
      stripCtx.clearRect(0,0,SW,SH);
      stripCtx.strokeStyle = 'rgba(51,63,38,0.15)';
      stripCtx.strokeRect(0.5,0.5,SW-1,SH-1);
      channels.forEach(function(c, i){
        var top = rowH*i, baseY = top + rowH/2;
        if (i > 0){
          stripCtx.strokeStyle = 'rgba(51,63,38,0.12)';
          stripCtx.beginPath();
          stripCtx.moveTo(0, top);
          stripCtx.lineTo(SW, top);
          stripCtx.stroke();
        }
        var isDrifting = c.faulty && d.driftT > 0.45;
        stripCtx.fillStyle = isDrifting ? '#8a2c24' : '#333f26';
        stripCtx.font = '9px monospace';
        stripCtx.fillText(c.name, 6, baseY + 3);

        stripCtx.beginPath();
        stripCtx.strokeStyle = c.faulty ? (isDrifting ? '#8a2c24' : '#8a4324') : '#5c6a47';
        stripCtx.lineWidth = 1.3;
        for (var x = 0; x < c.buf.length; x++){
          var px = labelW + x * (stripPlotW / BUF_LEN);
          var py = baseY - c.buf[x] * 0.9;
          if (x === 0) stripCtx.moveTo(px, py); else stripCtx.lineTo(px, py);
        }
        stripCtx.stroke();

        if (isDrifting){
          stripCtx.fillStyle = '#8a2c24';
          stripCtx.font = 'bold 9px monospace';
          stripCtx.fillText('DRIFTING', SW - 56, baseY + 3);
        }
      });
    }

    // ---- view 2: latent-space scatter ----
    var clusterCx = LW*0.3, clusterCy = LH*0.55, clusterRx = 72, clusterRy = 46;
    var clusterPts = [];
    var CN = 46;
    for (var ci = 0; ci < CN; ci++){
      var ang = Math.random()*Math.PI*2, rad = Math.sqrt(Math.random());
      clusterPts.push({
        x: clusterCx + Math.cos(ang)*rad*clusterRx,
        y: clusterCy + Math.sin(ang)*rad*clusterRy
      });
    }
    var latentStartX = clusterCx + 48, latentStartY = clusterCy + 16;
    var latentTargetX = LW - 46, latentTargetY = 26;

    function drawLatent(d){
      latentCtx.clearRect(0,0,LW,LH);
      latentCtx.strokeStyle = 'rgba(51,63,38,0.15)';
      latentCtx.strokeRect(0.5,0.5,LW-1,LH-1);

      latentCtx.fillStyle = '#333f26';
      clusterPts.forEach(function(p){
        latentCtx.beginPath();
        latentCtx.arc(p.x, p.y, 2.2, 0, Math.PI*2);
        latentCtx.fill();
      });

      latentCtx.save();
      latentCtx.setLineDash([4,3]);
      latentCtx.strokeStyle = '#5c6a47';
      latentCtx.lineWidth = 1.2;
      latentCtx.beginPath();
      latentCtx.ellipse(clusterCx, clusterCy, clusterRx*1.3, clusterRy*1.3, 0, 0, Math.PI*2);
      latentCtx.stroke();
      latentCtx.restore();

      var px, py;
      if (d.phase === 'calm'){
        px = latentStartX + Math.sin(frame*0.1)*2;
        py = latentStartY + Math.cos(frame*0.13)*2;
      } else {
        px = latentStartX + (latentTargetX - latentStartX) * d.driftT;
        py = latentStartY + (latentTargetY - latentStartY) * d.driftT;
      }
      var outside = d.driftT > 0.75;
      latentCtx.fillStyle = outside ? '#8a2c24' : '#8a4324';
      latentCtx.beginPath();
      latentCtx.arc(px, py, outside ? 4 : 3, 0, Math.PI*2);
      latentCtx.fill();

      if (outside){
        latentCtx.fillStyle = '#8a2c24';
        latentCtx.font = 'bold 10px monospace';
        latentCtx.fillText('OUTSIDE TRAINED MANIFOLD', 8, LH - 8);
      }
    }

    // ---- view 3: reconstruction-error line chart ----
    var EBUF_LEN = 140;
    var errBuf = [];
    for (var ek = 0; ek < EBUF_LEN; ek++){ errBuf.push(6 + Math.random()*2); }
    var thresholdV = 40, maxV = 65;
    var errCrossed = false;
    var marginL = 10, marginR = 10, marginT = 12, marginB = 20;
    var errPlotW = EW - marginL - marginR, errPlotH = EH - marginT - marginB;
    function yFor(v){ return marginT + errPlotH - (v/maxV)*errPlotH; }

    function stepError(d){
      var v = 6 + (Math.random()-0.5)*3 + d.driftT*d.driftT*50;
      errBuf.push(v);
      if (errBuf.length > EBUF_LEN) errBuf.shift();
      if (d.phase === 'calm') errCrossed = false;
      else if (v >= thresholdV) errCrossed = true;
    }

    function drawError(){
      errCtx.clearRect(0,0,EW,EH);
      errCtx.strokeStyle = 'rgba(51,63,38,0.15)';
      errCtx.strokeRect(0.5,0.5,EW-1,EH-1);

      var thY = yFor(thresholdV);
      errCtx.save();
      errCtx.setLineDash([4,3]);
      errCtx.strokeStyle = '#8a2c24';
      errCtx.lineWidth = 1.2;
      errCtx.beginPath();
      errCtx.moveTo(marginL, thY);
      errCtx.lineTo(EW - marginR, thY);
      errCtx.stroke();
      errCtx.restore();
      errCtx.fillStyle = '#8a2c24';
      errCtx.font = '9px monospace';
      errCtx.fillText('threshold', EW - marginR - 52, thY - 3);

      errCtx.beginPath();
      errBuf.forEach(function(v, i){
        var x = marginL + i * (errPlotW / EBUF_LEN);
        var y = yFor(v);
        if (i === 0) errCtx.moveTo(x,y); else errCtx.lineTo(x,y);
      });
      errCtx.strokeStyle = errCrossed ? '#8a2c24' : '#3a5a30';
      errCtx.lineWidth = 1.4;
      errCtx.stroke();
    }

    // ---- drive all three views from the one shared clock ----
    function tick(){
      var d = driftInfo();
      stepStrip(d);
      stepError(d);
      drawStrip(d);
      drawLatent(d);
      drawError();

      if (errCrossed){
        note.className = 'viz-note err';
        note.textContent = 'ANOMALY — SUBSYSTEM DRIFT DETECTED';
      } else if (d.phase === 'drifting'){
        note.className = 'viz-note';
        note.textContent = 'reconstruction error rising -- reaction-wheel channel drifting from the nominal manifold...';
      } else {
        note.className = 'viz-note';
        note.textContent = 'monitoring telemetry channels against the learned nominal manifold...';
      }
      frame++;
    }

    tick();
    var timer = setInterval(tick, 45);
    registerCancel(function(){ clearInterval(timer); });
  }

  // ---------- hash join visualization ----------

  function renderSQLViz(){
    var orders = [
      { id: 1, cust: 1002 },
      { id: 2, cust: 1005 },
      { id: 3, cust: 1002 },
      { id: 4, cust: 1009 }
    ];
    var customers = [
      { cid: 1002, name: 'Alice' },
      { cid: 1005, name: 'Bob' },
      { cid: 1007, name: 'Cleo' }
    ];

    var div = block();
    div.innerHTML =
      '<div style="display:flex; gap:24px; flex-wrap:wrap;">' +
        '<div>' +
          '<div class="dim">orders (probe side)</div>' +
          '<table class="boxtable" id="sql-orders"><tr><th>id</th><th>cust</th></tr>' +
            orders.map(function(o,i){ return '<tr data-i="'+i+'"><td>'+o.id+'</td><td>'+o.cust+'</td></tr>'; }).join('') +
          '</table>' +
        '</div>' +
        '<div>' +
          '<div class="dim">customers (build side -> hash table)</div>' +
          '<table class="boxtable" id="sql-customers"><tr><th>cid</th><th>name</th></tr>' +
            customers.map(function(c,i){ return '<tr data-i="'+i+'"><td>'+c.cid+'</td><td>'+c.name+'</td></tr>'; }).join('') +
          '</table>' +
        '</div>' +
        '<div>' +
          '<div class="dim">result (hash join output)</div>' +
          '<table class="boxtable" id="sql-result"><tr><th>order</th><th>cust</th><th>name</th></tr></table>' +
        '</div>' +
      '</div>' +
      '<div class="viz-note"></div>';

    var ordersRows = div.querySelectorAll('#sql-orders tr[data-i]');
    var custRows = div.querySelectorAll('#sql-customers tr[data-i]');
    var resultTable = div.querySelector('#sql-result');
    var note = div.querySelector('.viz-note');

    // build steps: phase 1 build hash table (highlight each customer row), phase 2 probe each order row
    var steps = [];
    customers.forEach(function(c, i){
      steps.push({ phase:'build', ci:i });
    });
    orders.forEach(function(o, i){
      var match = customers.findIndex(function(c){ return c.cid === o.cust; });
      steps.push({ phase:'probe', oi:i, match:match });
    });

    var idx = 0;
    function clearHL(rows){
      rows.forEach(function(r){ r.className = ''; });
    }

    function step(){
      if (idx >= steps.length){
        note.textContent = 'hash join complete.';
        clearInterval(timer);
        return;
      }
      var s = steps[idx];
      if (s.phase === 'build'){
        clearHL(custRows);
        custRows[s.ci].className = 'hl-new';
        note.textContent = 'building hash table on customers.cid: hashing "' + customers[s.ci].name + '"...';
      } else {
        clearHL(ordersRows);
        ordersRows[s.oi].className = 'hl-probe';
        clearHL(custRows);
        if (s.match !== -1){
          custRows[s.match].className = 'hl-match';
          var o = orders[s.oi], c = customers[s.match];
          var row = document.createElement('tr');
          row.innerHTML = '<td>'+o.id+'</td><td>'+o.cust+'</td><td>'+c.name+'</td>';
          resultTable.appendChild(row);
          note.textContent = 'probing order ' + o.id + ' -- match found: ' + c.name + '.';
        } else {
          ordersRows[s.oi].className = 'hl-nomatch';
          note.textContent = 'probing order ' + orders[s.oi].id + ' -- no match in hash table.';
        }
      }
      idx++;
      scrollBottom();
    }

    step();
    var timer = setInterval(step, 650);
    registerCancel(function(){ clearInterval(timer); });
  }

  // ---------- boot ----------

  function printBanner(withHistoryGreeting){
    printHTML(
      '<div class="heading">HEWITT WATKINS :: PORTFOLIO TERMINAL</div>' +
      '<div class="dim">CS @ University of Chicago -- B.S./M.S. expected June 2027</div>'
    );
    printText('This is an interactive terminal, not a scrolling page.\nType \'help\' to see every available command, or jump straight to\n\'about\', \'work\', \'projects\', \'skills\', or \'hobbies\'.');
  }

  printBanner(true);

  // ---------- input handling ----------

  var history = [];
  var historyIdx = -1;

  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var val = input.value;
      if (val.trim() !== ''){
        history.push(val);
        historyIdx = history.length;
      }
      input.value = '';
      run(val);
    } else if (e.key === 'ArrowUp'){
      if (history.length){
        historyIdx = Math.max(0, historyIdx - 1);
        input.value = history[historyIdx] || '';
        e.preventDefault();
      }
    } else if (e.key === 'ArrowDown'){
      if (history.length){
        historyIdx = Math.min(history.length, historyIdx + 1);
        input.value = history[historyIdx] || '';
        e.preventDefault();
      }
    }
  });

  terminal.addEventListener('click', function(){ input.focus(); });
  input.focus();

})();
</script>
